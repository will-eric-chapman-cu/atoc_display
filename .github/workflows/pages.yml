name: Publish ATOC display

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: github-pages-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/calendar-requirements.txt
      - run: pip install -r scripts/calendar-requirements.txt
      - name: Build the public calendar and copy the display files
        run: |
          mkdir _site
          cp -r index.html content.json .nojekyll assets images _site/
          python scripts/calendar_feed.py --output _site/calendar.json
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
